  // which is what hbe.js listens for (hbe.js line 268-292)
  var btn=document.createElement("button");btn.className="hbe-submit-btn";btn.type="button";
  btn.textContent="\u89e3\u9501";
  btn.addEventListener("click",function(){

    m.dispatchEvent(new KeyboardEvent("keydown",{keyCode:13,which:13,key:"Enter",bubbles:true}));
  });
  var wrapper=container.querySelector(".hbe-input");
  if(wrapper)wrapper.parentNode.insertBefore(btn,wrapper.nextSibling);

  // Hint text
  var hint=document.createElement("div");hint.className="hbe-hint";
  hint.textContent="\u8f93\u5165\u5bc6\u7801\u540e\u70b9\u51fb\u89e3\u9501\uff0c\u6216\u6309 Enter \u952e";
  btn.parentNode.insertBefore(hint,btn.nextSibling);
})();
