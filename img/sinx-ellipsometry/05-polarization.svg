<svg xmlns="http://www.w3.org/2000/svg" width="840px" height="308px" viewBox="0 0 840 308" role="img" aria-labelledby="title desc">
  <title id="title">等振幅的 p、s 分量以不同相位差叠加</title>
  <desc id="desc">电场在垂直于传播方向的平面内振动。两分量等振幅时，相差零度画出直线，相差四十五度画出椭圆，相差九十度画出圆。</desc>
  <defs>
    <marker id="axis-tip" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L6 3L0 6Z" fill="#718694"/>
    </marker>
    <g id="axes" fill="none" stroke="#718694" stroke-width="1.4" marker-end="url(#axis-tip)">
      <path d="M-76 0H78"/>
      <path d="M0 76V-78"/>
    </g>
  </defs>
  <rect width="840" height="308" rx="20" fill="#f4f8fa"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" fill="#142c3a">
    <text x="36" y="51" font-size="28" font-weight="700">两分量等振幅时，相位差决定电场轨迹</text>
    <g transform="translate(148 160)">
      <use href="#axes"/>
      <text x="85" y="6" font-size="19" fill="#3d5665">p</text>
      <text x="-20" y="-70" font-size="19" fill="#3d5665">s</text>
      <path d="M-58 58L58 -58" stroke="#007a73" stroke-width="4" stroke-linecap="round"/>
      <text y="117" text-anchor="middle" font-size="22">Δ = 0° · 线偏振</text>
    </g>
    <g transform="translate(420 160)">
      <use href="#axes"/>
      <text x="85" y="6" font-size="19" fill="#3d5665">p</text>
      <text x="-20" y="-70" font-size="19" fill="#3d5665">s</text>
      <ellipse rx="75.78" ry="31.39" transform="matrix(0.707107 -0.707107 0.707107 0.707107 0 0)" stroke="#007a73" stroke-width="4" fill="none"/>
      <text y="117" text-anchor="middle" font-size="22">Δ = 45° · 椭圆偏振</text>
    </g>
    <g transform="translate(692 160)">
      <use href="#axes"/>
      <text x="85" y="6" font-size="19" fill="#3d5665">p</text>
      <text x="-20" y="-70" font-size="19" fill="#3d5665">s</text>
      <circle r="58" stroke="#007a73" stroke-width="4" fill="none"/>
      <text y="117" text-anchor="middle" font-size="22">Δ = 90° · 圆偏振</text>
    </g>
  </g>
</svg>
