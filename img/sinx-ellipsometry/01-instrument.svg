<svg xmlns="http://www.w3.org/2000/svg" width="840px" height="408px" viewBox="0 0 840 408" role="img" aria-labelledby="title desc">
  <title id="title">反射式光谱椭偏仪的光路</title>
  <desc id="desc">宽带光经起偏器和图示位置的补偿器后斜入射样品，镜面主反射被检偏器和光谱探测器采集。入射角以样品法线为基准。</desc>
