    <path d="M420 145V315" stroke="#6e8190" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="420" y="133" font-size="19" fill="#516571" text-anchor="middle">样品法线</text>
    <rect x="244" y="316" width="352" height="14" rx="2" fill="#449a95"/>
    <rect x="244" y="330" width="352" height="54" rx="4" fill="#dbe7ee" stroke="#a5bac7"/>
    <text x="420" y="366" text-anchor="middle" font-size="22">SiNₓ 薄膜／熔融石英衬底</text>
    <g stroke="#007a73" stroke-width="3.5" fill="none" marker-end="url(#arrow)">
      <path d="M99 134L169 174"/>
      <path d="M213 198L258 224"/>
      <path d="M308 252L415 313"/>
      <path d="M425 313L581 225"/>
      <path d="M637 193L730 140"/>
    </g>
    <path d="M420 263A53 53 0 0 0 374 290" stroke="#516571" stroke-width="2" fill="none"/>
    <text x="398" y="253" text-anchor="middle" font-size="21">θ₀</text>
    <circle cx="420" cy="316" r="4" fill="#007a73"/>
    <g stroke="#a5bac7" stroke-width="1.4" fill="#fff">
      <rect x="37" y="99" width="111" height="39" rx="7"/>
      <rect x="146" y="164" width="93" height="41" rx="7"/>
      <rect x="235" y="215" width="97" height="41" rx="7"/>
