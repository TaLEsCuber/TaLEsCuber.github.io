<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img"><title>两个测量通道，确定一把频率尺</title><desc>重复频率通过直接探测测量，CEO 通过低频端倍频后与高频端拍频测量。</desc><rect width="1100" height="650" rx="20" fill="#f7f9fc"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#20334b;font-size:21px}.title{font-size:29px;font-weight:bold}.small{font-size:18px}.blue{fill:#2165ad}.red{fill:#c34d3e}</style><text x="45" y="52" class="title">两个测量通道，确定一把频率尺</text><rect x="50" y="98" width="225" height="70" rx="12" fill="#e7eff9" stroke="#bdcde0"/><text x="68" y="136" class="">锁模脉冲列</text><line x1="275" y1="133" x2="336" y2="133" stroke="#546b85" stroke-width="3" stroke-dasharray=""/><path d="M333,127 L345,133 L333,139" fill="#546b85"/><rect x="345" y="98" width="295" height="70" rx="12" fill="#e7eff9" stroke="#bdcde0"/><text x="363" y="136" class="">快速光电探测器</text><line x1="640" y1="133" x2="701" y2="133" stroke="#546b85" stroke-width="3" stroke-dasharray=""/><path d="M698,127 L710,133 L698,139" fill="#546b85"/><rect x="710" y="98" width="330" height="70" rx="12" fill="#e7eff9" stroke="#bdcde0"/><text x="728" y="136" class="">重复频率  f_rep</text><text x="50" y="226" class="">相干展宽后取两个波段，覆盖一个倍频程：</text><rect x="50" y="266" width="355" height="90" rx="12" fill="#e7eff9" stroke="#bdcde0"/><text x="68" y="304" class="">低频齿：n f_rep + f_CEO</text><line x1="405" y1="307" x2="466" y2="307" stroke="#546b85" stroke-width="3" stroke-dasharray=""/><path d="M463,301 L475,307 L463,313" fill="#546b85"/><rect x="475" y="266" width="155" height="90" rx="12" fill="#f9e9e3" stroke="#bdcde0"/><text x="493" y="304" class="">倍频 ×2</text><line x1="630" y1="307" x2="681" y2="307" stroke="#546b85" stroke-width="3" stroke-dasharray=""/><path d="M678,301 L690,307 L678,313" fill="#546b85"/><rect x="690" y="266" width="355" height="90" rx="12" fill="#f9e9e3" stroke="#bdcde0"/><text x="708" y="304" class="">2n f_rep + 2 f_CEO</text><rect x="50" y="414" width="355" height="90" rx="12" fill="#e7eff9" stroke="#bdcde0"/><text x="68" y="452" class="">高频齿：2n f_rep + f_CEO</text><line x1="405" y1="459" x2="681" y2="459" stroke="#546b85" stroke-width="3" stroke-dasharray=""/><path d="M678,453 L690,459 L678,465" fill="#546b85"/><rect x="690" y="414" width="355" height="90" rx="12" fill="#e6f3ef" stroke="#bdcde0"/><text x="708" y="452" class="">重叠拍频 → f_CEO</text><line x1="865" y1="356" x2="865" y2="404" stroke="#546b85" stroke-width="3" stroke-dasharray=""/><path d="M859,402 L865,414 L871,402" fill="#546b85"/><text x="50" y="572" class="title">ν_n = n f_rep + f_CEO</text><text x="50" y="612" class="small">自参考测出偏移；外部参考与锁定环路赋予标尺稳定性和可溯源性。</text></svg>