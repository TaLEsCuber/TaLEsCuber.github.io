<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>激光发展史 · 交互知识图谱</title><style>
:root{--paper:#f5f7fb;--ink:#13253f;--line:#d9e1ed;--blue:#215de0;--muted:#596b82}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:16px}button{font:inherit;cursor:pointer;color:inherit;border:1px solid var(--line);background:white;border-radius:7px;padding:9px 14px}button:hover{border-color:var(--blue);color:var(--blue)}button:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:3px solid #ed8c42;outline-offset:3px}header{padding:25px 32px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px;background:white}h1{margin:5px 0;font-size:29px;letter-spacing:.03em}.eyebrow{font-size:13px;letter-spacing:.15em;color:var(--blue);font-weight:700}header p{margin:8px 0 0;color:var(--muted);font-size:15px}.badge{border-left:3px solid var(--blue);padding-left:14px;font-size:14px;line-height:1.8;white-space:nowrap}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:650px;height:calc(100vh - 145px)}.main{min-width:0;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 24px;flex-wrap:wrap}.controls{display:flex;gap:7px;align-items:center}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.canvas{flex:1;min-height:440px;position:relative;overflow:hidden;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:22px 22px}.canvas svg{width:100%;height:100%;touch-action:none;cursor:grab}.canvas svg:active{cursor:grabbing}.hint{position:absolute;bottom:16px;left:22px;color:var(--muted);font-size:14px;background:#f5f7fbe8;padding:8px 12px;border-radius:6px;pointer-events:none}.node{cursor:pointer}.node rect{fill:white;stroke:#cbd5e1;stroke-width:1.5}.node:hover rect{stroke:#215de0;stroke-width:3}.node.active rect{fill:#eef4ff;stroke:#215de0;stroke-width:3}.node text{pointer-events:none}.edge{fill:none;stroke:#8b9bb1;stroke-width:2;opacity:.52}.edge.hot{stroke:#215de0;stroke-width:3;opacity:1}.edgeLabel{font-size:12px;fill:#61748d;paint-order:stroke;stroke:#f5f7fb;stroke-width:5px}.detail{background:#12233c;color:#eef4fd;padding:28px 27px;overflow-y:auto}.detail .kicker{color:#84b0ff;font-size:14px;letter-spacing:.1em}.detail .year{font-size:43px;line-height:1.2;margin:21px 0 8px;font-weight:700;color:#a3c3ff}.detail h2{font-size:25px;margin:0 0 16px}.detail .type{display:inline-block;border:1px solid #425d7e;border-radius:5px;padding:4px 10px;font-size:14px}.detail h3{font-size:14px;font-weight:500;color:#9fb1cb;margin:25px 0 8px}.detail p{font-size:16px;line-height:1.85;margin:0}.detail a{color:#a8ceff;word-break:break-word;text-underline-offset:4px;font-size:14px;line-height:1.8}.related{display:flex;gap:7px;flex-wrap:wrap}.related button{background:#213754;border-color:#3a5375;color:#deebff;font-size:14px;padding:6px 9px}.foot{padding:13px 24px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);line-height:1.7}.timeline{display:flex;overflow-x:auto;gap:6px;padding:12px 24px;border-top:1px solid var(--line);background:white}.timeline button{white-space:nowrap;font-size:14px;padding:7px 10px}.timeline button[aria-pressed=true]{background:#215de0;color:white;border-color:#215de0}@media(max-width:850px){header{padding:20px}.badge{display:none}.workspace{display:flex;flex-direction:column;height:auto}.main{height:610px}.detail{overflow:visible;padding:26px}.toolbar{padding:12px}.legend{gap:8px}h1{font-size:24px}.detail .year{margin-top:12px}.foot{padding:12px}.hint{font-size:13px}}
</style></head><body><header><div><div class="eyebrow">LASER ATLAS / 激光原理与技术 · 作业一</div><h1>激光发展史</h1><p>沿着理论、材料与控制技术，探索一束光的演进。</p></div><div class="badge">15 个里程碑<br>1917 — 1988</div></header><div class="workspace"><section class="main" aria-label="交互知识图谱"><div class="toolbar"><div class="legend" id="legend"></div><div class="controls"><button id="minus" aria-label="缩小图谱">−</button><span id="zoomLabel" style="font-size:14px;min-width:45px;text-align:center">100%</span><button id="plus" aria-label="放大图谱">＋</button><button id="reset">全览</button></div></div><div class="canvas"><svg id="graph" aria-label="激光发展知识图谱，可拖动并点击节点" role="group"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7e94b2"/></marker></defs><g id="scene"></g></svg><div class="hint">点击节点阅读 · 拖动画布移动 · Ctrl + 滚轮缩放</div></div><nav class="timeline" id="timeline" aria-label="按时间选择里程碑"></nav><div class="foot">箭头表示所标注的知识或技术联系，并不意味着后一项成果只源于前一项。节点年份按成果或论文说明标注。参考资料联网打开，图谱本身可离线使用。</div></section><aside id="detail" class="detail" aria-live="polite"></aside></div><script>
const DATA={"nodes": [{"id": "einstein", "year": "1917", "title": "受激辐射", "type": "理论", "person": "阿尔伯特·爱因斯坦", "principle": "入射光可诱导激发态粒子向低能级跃迁，向同一光学模式增加光子；跃迁满足 hν = E₂ − E₁。", "meaning": "给出了用受激辐射放大光的物理基础。", "wave": "理论基础，无特定输出波长", "source": "https://www.nobelprize.org/prizes/physics/1981/ceremony-speech/", "ref": "诺贝尔奖官网：1981年物理学奖颁奖词", "x": 70, "y": 230}, {"id": "maser", "year": "1954", "title": "氨分子微波激射器", "type": "微波", "person": "戈登、齐格、汤斯；巴索夫与普罗霍罗夫独立开展相关研究", "principle": "通过分子束态选择建立非平衡布居，结合微波谐振腔实现受激辐射振荡。", "meaning": "把受激辐射放大从理论变成可工作的相干辐射装置。", "wave": "约1.25 cm，微波", "source": "https://journals.aps.org/prl/50years/timeline", "ref": "APS：1954年 Molecular Microwave Oscillator 论文条目", "x": 350, "y": 230}, {"id": "optical", "year": "1958", "title": "光学激射理论", "type": "理论", "person": "阿瑟·肖洛、查尔斯·汤斯", "principle": "分析红外与光学波段的增益、泵浦和谐振条件；开放式反射镜结构成为关键思路。", "meaning": "把微波激射概念推进到更短波长。", "wave": "理论方案", "source": "https://link.aps.org/doi/10.1103/PhysRev.112.1940", "ref": "Schawlow & Townes, Infrared and Optical Masers (1958)", "x": 630, "y": 230}, {"id": "ruby", "year": "1960", "title": "红宝石激光器", "type": "固体", "person": "西奥多·梅曼", "principle": "闪光灯泵浦红宝石中的Cr³⁺离子；三能级系统建立反转，端面反馈形成脉冲激光。", "meaning": "1960年5月16日实现首台工作的激光器。", "wave": "约694.3 nm，红光", "source": "https://www.nature.com/articles/187493a0", "ref": "Maiman, Stimulated Optical Radiation in Ruby (1960)", "x": 910, "y": 230}, {"id": "hene", "year": "1960", "title": "氦氖激光器", "type": "气体", "person": "阿里·贾万、威廉·贝内特、唐纳德·赫里奥特", "principle": "气体放电先激发氦，再通过碰撞向氖传递能量，由氖原子的跃迁输出激光。", "meaning": "实现连续激光运行；首次实验在1960年，论文发表于1961年。", "wave": "首次约1.15 μm；常见红光线632.8 nm", "source": "https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.6.106", "ref": "Javan et al., Population Inversion and Continuous Optical Maser Oscillation… (1961)", "x": 1190, "y": 70}, {"id": "glass", "year": "1961", "title": "掺钕玻璃激光器", "type": "固体", "person": "埃利亚斯·斯尼策", "principle": "玻璃作为基质，掺入Nd³⁺提供激光跃迁；通过光泵浦实现增益。", "meaning": "扩展固体增益介质，也为后续掺杂光纤增益研究提供材料基础。", "wave": "典型约1.06 μm", "source": "https://www.optica.org/about/newsroom/obituaries/2012/elias_snitzer/", "ref": "Optica：Elias Snitzer 生平与贡献", "x": 1190, "y": 390}, {"id": "diode", "year": "1962", "title": "半导体注入激光器", "type": "半导体", "person": "罗伯特·霍尔等多个研究团队", "principle": "正向电流注入电子与空穴，在有源区建立光学增益，利用端面反射形成反馈。", "meaning": "把电能直接转成相干光；早期器件的温度与阈值限制推动异质结构研究。", "wave": "早期GaAs器件为近红外", "source": "https://www.nobelprize.org/uploads/2018/06/advanced-physicsprize2000-2.pdf", "ref": "诺贝尔奖官网：2000年物理学奖科学背景", "x": 1190, "y": 550}, {"id": "co2", "year": "1964", "title": "CO₂激光器", "type": "气体", "person": "C. 库马尔·N. 帕特尔", "principle": "分子振动—转动能级提供增益；典型混合气体中，放电激发的N₂向CO₂传能，He帮助能级弛豫与散热。", "meaning": "高效红外输出推动材料加工等应用。", "wave": "主要波段约10.6 μm与9.6 μm", "source": "https://journals.aps.org/pr/abstract/10.1103/PhysRev.136.A1187", "ref": "Patel, Continuous-Wave Laser Action on Vibrational-Rotational Transitions of CO₂ (1964)", "x": 1470, "y": 70}, {"id": "yag", "year": "1964", "title": "Nd:YAG激光器", "type": "固体", "person": "J. E. Geusic、H. M. Marcos、L. G. Van Uitert", "principle": "Nd³⁺掺入钇铝石榴石晶体；典型四能级运行，光泵浦后在谐振腔内振荡。", "meaning": "形成重要的固体激光平台，可结合调Q、倍频和后续二极管泵浦技术。", "wave": "典型1064 nm", "source": "https://pubs.aip.org/aip/apl/article-pdf/4/10/182/18417095/182_1_online.pdf", "ref": "Geusic et al., Laser Oscillations in Nd-Doped…Garnets (1964)", "x": 1470, "y": 230}, {"id": "fiber", "year": "1964", "title": "光纤激光放大", "type": "光纤", "person": "查尔斯·科斯特、埃利亚斯·斯尼策", "principle": "掺钕玻璃光纤同时提供波导约束与受激辐射增益；该实验抑制反馈以测量放大。", "meaning": "展示光纤中的大增益，连接固体激光材料与波导技术。", "wave": "实验约1.06 μm", "source": "https://opg.optica.org/ao/abstract.cfm?uri=ao-3-10-1182", "ref": "Koester & Snitzer, Amplification in a Fiber Laser (1964)", "x": 1470, "y": 390}, {"id": "locking", "year": "1964", "title": "主动锁模", "type": "脉冲技术", "person": "L. E. Hargrove、R. L. Fork、M. A. Pollack", "principle": "以腔往返频率同步调制，使多个纵模形成稳定相位关系，叠加为周期性的短脉冲。", "meaning": "从控制激光波长，走向控制光脉冲的时间结构；此处按论文发表年份标注。", "wave": "技术方法，不限定单一波长", "source": "https://doi.org/10.1063/1.1754025", "ref": "Hargrove et al., Locking of He–Ne Laser Modes… (1964)", "x": 1470, "y": 710}, {"id": "dye", "year": "1966", "title": "染料激光器", "type": "染料", "person": "彼得·索罗金、约翰·兰卡德；弗里茨·舍费尔等", "principle": "有机染料宽荧光带提供增益，配合腔内选频元件可调谐输出；通常采用光泵浦。", "meaning": "让连续调节激光波长成为重要能力，服务光谱研究。", "wave": "波段取决于染料及选频范围", "source": "https://pmc.ncbi.nlm.nih.gov/articles/PMC4711863/", "ref": "Lankard：Peter Pitirimovich Sorokin… (PNAS, 2016)", "x": 1750, "y": 230}, {"id": "hetero", "year": "1970前后", "title": "室温连续半导体激光", "type": "半导体", "person": "阿尔费罗夫团队；林严雄、莫顿·帕尼什等；克勒默参与异质结构理论发展", "principle": "双异质结构将载流子和光场约束在有源层中，降低阈值与损耗，使室温连续运行成为现实。", "meaning": "推动半导体激光器实用化，为光通信和消费电子提供紧凑光源。", "wave": "随材料体系而变", "source": "https://www.nobelprize.org/uploads/2018/06/advanced-physicsprize2000.pdf", "ref": "诺贝尔奖官网：2000年物理学奖科学背景，第12–13页", "x": 1750, "y": 550}, {"id": "cpa", "year": "1985", "title": "啁啾脉冲放大 CPA", "type": "脉冲技术", "person": "唐娜·斯特里克兰、热拉尔·穆鲁", "principle": "先展宽脉冲以降低放大过程中的峰值强度，放大后再压缩，获得高峰值功率的短脉冲。", "meaning": "缓解放大中的光学损伤限制，推动超强超快激光研究。", "wave": "技术方法，不限定单一波长", "source": "https://www.nobelprize.org/uploads/2018/10/advanced-physicsprize2018.pdf", "ref": "诺贝尔奖官网：2018年物理学奖科学背景", "x": 2030, "y": 710}, {"id": "clad", "year": "1988", "title": "双包层光纤激光器", "type": "光纤", "person": "埃利亚斯·斯尼策及团队", "principle": "较大的内包层收集泵浦光，掺杂纤芯提供信号增益，兼顾泵浦耦合与波导约束。", "meaning": "为光纤激光器功率提升提供重要结构路线。", "wave": "取决于掺杂离子，如Nd³⁺、Yb³⁺", "source": "https://www.optica.org/about/newsroom/obituaries/2012/elias_snitzer/", "ref": "Optica：1988年双包层光纤激光器贡献", "x": 2030, "y": 390}], "edges": [["einstein", "maser", "理论基础"], ["maser", "optical", "频段拓展"], ["optical", "ruby", "装置实现"], ["optical", "hene", "气体路线"], ["ruby", "glass", "介质拓展"], ["optical", "diode", "半导体路线"], ["hene", "co2", "分子介质拓展"], ["ruby", "yag", "晶体介质拓展"], ["glass", "fiber", "波导与增益结合"], ["hene", "locking", "时间结构控制"], ["ruby", "dye", "光泵浦与介质拓展"], ["diode", "hetero", "降低阈值"], ["locking", "cpa", "短脉冲放大"], ["fiber", "clad", "泵浦结构改进"]]};
const colors={'理论':'#215de0','微波':'#537694','固体':'#cc4661','气体':'#169184','半导体':'#8856c5','光纤':'#c78324','染料':'#c4579b','脉冲技术':'#4776c4'};
const svg=document.getElementById('graph'),scene=document.getElementById('scene'),detail=document.getElementById('detail');let selected='ruby',vb={x:850,y:0,w:1080,h:650};
document.getElementById('legend').innerHTML=Object.entries(colors).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('');
function render(){scene.innerHTML=DATA.edges.map(([a,b,label])=>{const n=DATA.nodes.find(n=>n.id===a),m=DATA.nodes.find(n=>n.id===b);const sx=n.x+225,sy=n.y+49,tx=m.x,ty=m.y+49;return `<path class="edge ${selected===a||selected===b?'hot':''}" marker-end="url(#arrow)" d="M${sx},${sy} C${sx+35},${sy} ${tx-35},${ty} ${tx},${ty}"/><text class="edgeLabel" x="${(sx+tx)/2}" y="${(sy+ty)/2-10}" text-anchor="middle">${label}</text>`}).join('')+DATA.nodes.map(n=>`<g class="node ${n.id===selected?'active':''}" role="button" tabindex="0" aria-label="${n.year}年 ${n.title}" data-id="${n.id}" transform="translate(${n.x},${n.y})"><rect width="225" height="98" rx="8"/><rect width="4" height="56" x="0" y="20" rx="2" style="fill:${colors[n.type]};stroke:none"/><text x="17" y="27" fill="${colors[n.type]}" font-size="16" font-weight="700">${n.year}</text><text x="17" y="55" fill="#13253f" font-size="17" font-weight="700">${n.title}</text><text x="17" y="80" fill="#63728a" font-size="13">${n.type}</text></g>`).join('');const n=DATA.nodes.find(n=>n.id===selected);detail.innerHTML=`<div class="kicker">MILESTONE / 节点详情</div><div class="year">${n.year}</div><h2>${n.title}</h2><span class="type">${n.type}</span><h3>代表人物</h3><p>${n.person}</p><h3>核心原理</h3><p>${n.principle}</p><h3>输出 / 波段</h3><p>${n.wave}</p><h3>历史意义</h3><p>${n.meaning}</p><h3>相关节点</h3><div class="related">${DATA.edges.filter(e=>e[0]===n.id||e[1]===n.id).map(e=>{const m=DATA.nodes.find(x=>x.id===(e[0]===n.id?e[1]:e[0]));return `<button data-select="${m.id}">${m.title}</button>`}).join('')}</div><h3>参考资料</h3><a href="${n.source}" target="_blank" rel="noopener noreferrer">${n.ref} ↗</a>`;document.getElementById('timeline').innerHTML=DATA.nodes.map(n=>`<button data-select="${n.id}" aria-pressed="${n.id===selected}">${n.year} · ${n.title}</button>`).join('');}
function select(id,focus=false){selected=id;render();if(focus){const n=DATA.nodes.find(n=>n.id===id);vb.x=n.x+112-vb.w/2;vb.y=n.y+49-vb.h/2;update();}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-select]');if(el)select(el.dataset.select,true)});
let down=null,moved=false;svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;down={px:e.clientX,py:e.clientY,x:vb.x,y:vb.y};moved=false;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.px,dy=e.clientY-down.py;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;const scale=Math.max(vb.w/svg.clientWidth,vb.h/svg.clientHeight);vb.x=down.x-dx*scale;vb.y=down.y-dy*scale;update()});svg.addEventListener('pointerup',e=>{if(!moved){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-id]');if(el)select(el.dataset.id)}down=null;});svg.addEventListener('pointercancel',()=>down=null);svg.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.id){e.preventDefault();select(e.target.dataset.id);scene.querySelector(`[data-id="${selected}"]`).focus()}});
function update(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);document.getElementById('zoomLabel').textContent=Math.round(2350/vb.w*100)+'%'}function zoom(f){const w=Math.max(600,Math.min(3500,vb.w*f)),ratio=w/vb.w;vb.x+=(vb.w-w)/2;vb.y+=vb.h*(1-ratio)/2;vb.h*=ratio;vb.w=w;update()}svg.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoom(e.deltaY>0?1.12:.89)}},{passive:false});document.getElementById('plus').onclick=()=>zoom(.8);document.getElementById('minus').onclick=()=>zoom(1.25);document.getElementById('reset').onclick=()=>{vb={x:0,y:0,w:2350,h:930};update()};render();update();
</script></body></html>
